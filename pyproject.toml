[project]
name = "ai-knowledge-graph"
version = "0.7.0"
description = "Takes a text document and generates an interactive knowledge graph"
authors = [{ name = "Robert McDermott", email = "robert.c.mcdermott@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["knowledge-graph", "llm", "visualization", "nlp", "vis-network"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "jinja2>=3.1",
    "networkx>=3.4.2",
    "requests>=2.32.3",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
all = ["pypdf>=4.0", "python-docx>=1.1", "fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27"]

[project.urls]
Homepage = "https://github.com/robert-mcdermott/ai-knowledge-graph"
Issues = "https://github.com/robert-mcdermott/ai-knowledge-graph/issues"

[project.scripts]
generate-graph = "knowledge_graph.main:main"
graph-chat = "knowledge_graph.query:main"
graph-serve = "knowledge_graph.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_graph = ["templates/*.j2", "templates/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
