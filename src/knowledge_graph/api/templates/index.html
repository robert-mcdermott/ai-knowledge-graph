<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知識圖譜生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .upload-section {
            padding: 40px;
            background: linear-gradient(to bottom, #f8f9fa, #ffffff);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
            transform: translateY(-2px);
        }

        .upload-area.dragging {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 0.9em;
        }

        .file-input {
            display: none;
        }

        .config-section {
            padding: 30px 40px;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
        }

        .config-title {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #333;
            font-weight: 600;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .config-item {
            display: flex;
            flex-direction: column;
        }

        .config-item label {
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }

        .config-item input[type="number"] {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .config-item input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .process-btn {
            width: 100%;
            margin-top: 20px;
        }

        .progress-section {
            padding: 40px;
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .progress-log {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .progress-item {
            padding: 8px;
            margin: 5px 0;
            border-left: 3px solid #667eea;
            padding-left: 15px;
            background: white;
            border-radius: 5px;
        }

        .progress-item .timestamp {
            color: #999;
            font-size: 0.85em;
            margin-right: 10px;
        }

        .result-section {
            padding: 40px;
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex: 1;
        }

        .selected-file {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .selected-file.active {
            display: block;
        }

        .selected-file-name {
            font-weight: 600;
            color: #667eea;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .processing {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 AI 知識圖譜生成器</h1>
            <p class="subtitle">上傳小說或文本，自動生成互動式知識圖譜</p>
        </header>

        <div class="main-card">
            <!-- Upload Section -->
            <div class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">點擊或拖曳文件到這裡</div>
                    <div class="upload-hint">支援 .txt 和 .md 格式的文本文件</div>
                    <input type="file" id="fileInput" class="file-input" accept=".txt,.md">
                </div>

                <div class="selected-file" id="selectedFile">
                    <div>已選擇文件：<span class="selected-file-name" id="fileName"></span></div>
                </div>
            </div>

            <!-- Config Section -->
            <div class="config-section">
                <div class="config-title">⚙️ 處理設定</div>
                <div class="config-grid">
                    <div class="config-item">
                        <label>文本塊大小 (Chunk Size)</label>
                        <input type="number" id="chunkSize" value="200" min="50" max="1000">
                    </div>
                    <div class="config-item">
                        <label>重疊字數 (Overlap)</label>
                        <input type="number" id="overlap" value="20" min="0" max="100">
                    </div>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="standardization" checked>
                    <label for="standardization">啟用實體標準化 (Entity Standardization)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="inference" checked>
                    <label for="inference">啟用關係推理 (Relationship Inference)</label>
                </div>

                <button class="btn process-btn" id="processBtn" disabled>開始生成知識圖譜</button>
            </div>

            <!-- Progress Section -->
            <div class="progress-section" id="progressSection">
                <div class="config-title">🔄 處理進度</div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar">0%</div>
                </div>
                <div class="progress-log" id="progressLog"></div>
            </div>

            <!-- Result Section -->
            <div class="result-section" id="resultSection">
                <div class="config-title">✅ 生成完成！</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statNodes">0</div>
                        <div class="stat-label">節點數</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statEdges">0</div>
                        <div class="stat-label">關係總數</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statOriginal">0</div>
                        <div class="stat-label">提取關係</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statInferred">0</div>
                        <div class="stat-label">推理關係</div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-secondary" onclick="location.reload()">重新開始</button>
                    <button class="btn btn-primary" id="viewBtn">查看知識圖譜</button>
                    <button class="btn btn-primary" id="downloadBtn">下載 HTML</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTaskId = null;
        let currentFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const selectedFile = document.getElementById('selectedFile');
        const fileName = document.getElementById('fileName');
        const uploadSection = document.getElementById('uploadSection');
        const progressSection = document.getElementById('progressSection');
        const resultSection = document.getElementById('resultSection');
        const progressBar = document.getElementById('progressBar');
        const progressLog = document.getElementById('progressLog');

        // File upload handling
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file.name.endsWith('.txt') && !file.name.endsWith('.md')) {
                alert('請選擇 .txt 或 .md 格式的文件');
                return;
            }
            currentFile = file;
            fileName.textContent = file.name;
            selectedFile.classList.add('active');
            processBtn.disabled = false;
        }

        // Process button
        processBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            processBtn.disabled = true;
            processBtn.textContent = '上傳中...';

            // Upload file
            const formData = new FormData();
            formData.append('file', currentFile);
            formData.append('chunk_size', document.getElementById('chunkSize').value);
            formData.append('overlap', document.getElementById('overlap').value);
            formData.append('enable_standardization', document.getElementById('standardization').checked);
            formData.append('enable_inference', document.getElementById('inference').checked);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('上傳失敗');
                }

                const data = await response.json();
                currentTaskId = data.task_id;

                // Show progress section
                uploadSection.style.display = 'none';
                progressSection.classList.add('active');

                // Connect WebSocket
                connectWebSocket(currentTaskId);

            } catch (error) {
                alert('上傳失敗: ' + error.message);
                processBtn.disabled = false;
                processBtn.textContent = '開始生成知識圖譜';
            }
        });

        function connectWebSocket(taskId) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${protocol}//${window.location.host}/ws/${taskId}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.progress !== undefined) {
                    progressBar.style.width = data.progress + '%';
                    progressBar.textContent = Math.round(data.progress) + '%';

                    const logItem = document.createElement('div');
                    logItem.className = 'progress-item';
                    logItem.innerHTML = `
                        <span class="timestamp">${new Date(data.timestamp).toLocaleTimeString()}</span>
                        <strong>${data.phase}:</strong> ${data.message}
                    `;
                    progressLog.appendChild(logItem);
                    progressLog.scrollTop = progressLog.scrollHeight;
                }

                if (data.status === 'completed') {
                    showResults(data.stats);
                } else if (data.status === 'error') {
                    alert('處理失敗: ' + data.message);
                    location.reload();
                }
            };

            ws.onerror = () => {
                alert('連接失敗，請重試');
                location.reload();
            };
        }

        function showResults(stats) {
            progressSection.classList.remove('active');
            resultSection.classList.add('active');

            document.getElementById('statNodes').textContent = stats.nodes;
            document.getElementById('statEdges').textContent = stats.edges;
            document.getElementById('statOriginal').textContent = stats.original_edges;
            document.getElementById('statInferred').textContent = stats.inferred_edges;

            document.getElementById('viewBtn').onclick = () => {
                window.open(`/api/view/${currentTaskId}`, '_blank');
            };

            document.getElementById('downloadBtn').onclick = () => {
                window.location.href = `/api/download/${currentTaskId}`;
            };
        }
    </script>
</body>
</html>
